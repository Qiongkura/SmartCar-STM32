; 单协二面遥控器 —— 左摇杆发射端
; 芯片: STM32F103C8T6 (蓝药丸, 插在遥控器底板 U1/U2 座上)
; 排线来源: ProPrj_单协二面遥控器1.epro2 网络表:
;   左摇杆 LEFT: X=A0  Y=A1  SW(按下)=B10   (3.3V/GND)
;   按键: STOP=A4 (按下=低)  MODE=A5 (按下=低)
;   蓝牙座: A9=TX->蓝牙RXD(中间经过STOP自锁开关!)  A10=RX<-蓝牙TXD, 9600
;   OLED: SCL=B8 SDA=B9, SSD1306 128x64 (oled.c 驱动, 开机 Hello + 状态页)
;
; 协议和小车模式七完全一致:
;   摇杆有输出: AA 55 06 LIN ROT XOR  (混控帧, LIN/ROT = -100~100, 上=前进 右=右转)
;   摇杆居中:   AA 55 06 00 00 XOR    (=停车帧, 小车端直接动力刹车)

[env:remote]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
build_flags =
    -Wall
    -I src
