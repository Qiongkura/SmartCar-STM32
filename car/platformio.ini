; 单片机协会大二技术考核 —— 智能小车固件
; 芯片: STM32F103C8T6 (核心板插在"单协二面小车"底板上)
;
; 用法:
;     pio run                  编译
;     pio run -t upload        用 ST-Link 下载
; 串口 ISP 用户: 编译后用 .pio/build/bluepill_f103c8/firmware.hex 烧录

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
extra_scripts = post:extra_script.py
build_flags =
    -Wall
    -I src
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
